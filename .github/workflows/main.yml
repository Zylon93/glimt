name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordna projektet
        shell: bash
        run: |
          set -e
          P=app/src/main
          mkdir -p $P/java/se/pontus/glimt $P/res/drawable
          # Flytta filer om de laddats upp platt i roten
          for f in *.kt; do [ -e "$f" ] && mv "$f" $P/java/se/pontus/glimt/; done
          [ -e AndroidManifest.xml ] && mv AndroidManifest.xml $P/
          for f in banner.xml ic_launcher.xml; do [ -e "$f" ] && mv "$f" $P/res/drawable/; done
          # Byggfiler
          cat > settings.gradle.kts <<'GLIMT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Glimt"
          include(":app")
          GLIMT_EOF
          cat > build.gradle.kts <<'GLIMT_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
          }
          GLIMT_EOF
          cat > gradle.properties <<'GLIMT_EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          GLIMT_EOF
          cat > app/build.gradle.kts <<'GLIMT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()

          android {
              namespace = "se.pontus.glimt"
              compileSdk = 35

              defaultConfig {
                  applicationId = "se.pontus.glimt"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
              }

              // Samma nyckel varje bygge, så att nya versioner kan installeras ovanpå gamla.
              signingConfigs {
                  create("glimt") {
                      storeFile = file("glimt.keystore")
                      storePassword = "glimtglimt"
                      keyAlias = "glimt"
                      keyPassword = "glimtglimt"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("glimt")
                  }
                  debug {
                      signingConfig = signingConfigs.getByName("glimt")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.12.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("io.coil-kt:coil-compose:2.7.0")

              val media3 = "1.5.1"
              implementation("androidx.media3:media3-exoplayer:$media3")
              implementation("androidx.media3:media3-exoplayer-hls:$media3")
              implementation("androidx.media3:media3-ui:$media3")
          }
          GLIMT_EOF
          cat > app/proguard-rules.pro <<'GLIMT_EOF'
          # Appen använder ingen reflektion; bibliotekens egna regler räcker.
          GLIMT_EOF
          echo "" | base64 -d > app/glimt.keystore
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bygg release-APK
        run: gradle assembleRelease --no-daemon

      - name: Döp om
        run: cp app/build/outputs/apk/release/app-release.apk glimt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glimt-apk
          path: glimt.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glimt 1.0.${{ github.run_number }}
          files: glimt.apk
          make_latest: true

