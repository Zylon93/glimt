name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versionsnummer = körningsnummer + 100 (arbetsflödet byttes ut vid 1.0.8)
      - name: Sätt versionsnummer
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Bygg release-APK
        run: gradle assembleRelease --no-daemon

      - name: Döp om
        run: cp app/build/outputs/apk/release/app-release.apk glimt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: glimt-apk
          path: glimt.apk

      - name: Publicera som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: Glimt 1.0.${{ env.BUILD_NUMBER }}
          files: glimt.apk
          make_latest: true
